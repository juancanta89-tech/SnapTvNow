name: Inspect recent movies in SNAPTVNOW
on:
  push:
    branches: [support/recent-movies-20261110]

permissions:
  contents: read
  actions: read

concurrency:
  group: snaptvnow-native-acceptance
  cancel-in-progress: false

jobs:
  movies:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LIVE_REQUESTED: ${{ contains(github.event.head_commit.message, '[native-playback]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the exact movie and one title in its category
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: python3 verification/recent-movies/acceptance.py metadata
      - uses: actions/setup-java@v4
        if: env.LIVE_REQUESTED == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: env.LIVE_REQUESTED == 'true'
      - name: Install the native verification toolchain
        if: env.LIVE_REQUESTED == 'true'
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile the external native UI probe
        if: env.LIVE_REQUESTED == 'true'
        run: bash verification/recent-movies/build-probe.sh
      - name: Verify the existing signed official app
        if: env.LIVE_REQUESTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 verification/recent-movies/acceptance.py prepare
      - name: Prepare direct emulator audio observation
        if: env.LIVE_REQUESTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'QEMU_AUDIO_DRV=wav' >> "$GITHUB_ENV"
          echo 'QEMU_AUDIO_OUT_DRV=wav' >> "$GITHUB_ENV"
          echo 'QEMU_AUDIO_IN_DRV=none' >> "$GITHUB_ENV"
          echo "QEMU_WAV_PATH=$RUNNER_TEMP/snaptvnow-recent-movies-probe/emulator-output.wav" >> "$GITHUB_ENV"
          echo 'QEMU_WAV_FREQUENCY=44100' >> "$GITHUB_ENV"
          echo 'QEMU_WAV_FORMAT=s16' >> "$GITHUB_ENV"
          echo 'QEMU_WAV_DAC_FIXED_CHANNELS=2' >> "$GITHUB_ENV"
      - name: Enable the isolated Android runner
        if: env.LIVE_REQUESTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe both exact movies in the official Android app
        if: env.LIVE_REQUESTED == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-boot-timeout: 240
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: python3 verification/recent-movies/acceptance.py run
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNAPTVNOW-recent-movies-evidence
          path: |
            ${{ runner.temp }}/snaptvnow-recent-movies-probe/movie-metadata.json
            ${{ runner.temp }}/snaptvnow-recent-movies-probe/preparation.json
            ${{ runner.temp }}/snaptvnow-recent-movies-probe/native-report.json
          if-no-files-found: ignore
          retention-days: 7
