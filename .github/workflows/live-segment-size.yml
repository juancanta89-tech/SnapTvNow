name: Measure complete Gol Peru TS segments
on:
  push:
    branches: [verify/live-transport-20261119]
    paths: [.github/workflows/live-segment-size.yml, verification/live-formats/segment_size.py]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Count complete TS bytes without storing video
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: python3 verification/live-formats/segment_size.py
