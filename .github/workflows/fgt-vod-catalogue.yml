name: Inspect original FGT warm mobile movie refresh
on:
  push:
    branches: [automation/repair-2026-11-12-03]
permissions:
  contents: read
concurrency:
  group: snaptvnow-fgt-acceptance
  cancel-in-progress: false
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require the existing protected test login
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: |
          if [[ -z "$DIEGUITO2026_PASSWORD" ]]; then
            echo '::error::The protected authorized test login is not available.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install the verification SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile the external catalogue controller
        run: bash verification/fgt-vod/build-probe.sh
      - name: Verify the unchanged official FGT APK
        id: official
        run: python3 verification/fgt-vod/official.py
      - name: Enable the isolated Android runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open only the movie catalogue and the reported category
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 240
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: python3 verification/fgt-vod/catalogue.py
      - name: Keep only non-sensitive catalogue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNAPTVNOW-FGT-VOD-catalogue
          path: |
            ${{ runner.temp }}/snaptvnow-native-probe/preparation.json
            ${{ runner.temp }}/snaptvnow-native-probe/vod-report.json
          if-no-files-found: ignore
          retention-days: 7


