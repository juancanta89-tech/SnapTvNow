name: Compare live delivery formats
on:
  push:
    branches: [verify/live-formats-20261118]
    paths:
      - verification/live-formats/probe.py
      - .github/workflows/live-format-compare.yml
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare the local media decoder
        run: |
          if command -v ffmpeg && command -v ffprobe; then exit 0; fi
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\tpriority:1\n%s\tpriority:2\n' \
              'https://ftp.osuosl.org/pub/ubuntu/' 'https://mirrors.kernel.org/ubuntu/' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::https::Timeout=12 update -qq
          sudo apt-get -o Acquire::Retries=1 --no-install-recommends -y -qq install ffmpeg
      - name: Decode the three registered Gol Peru variants
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        working-directory: verification/live-formats
        run: |
          python3 - <<'PYTHON'
          from alternatives import variants
          from probe import decode, emit, media_url, ProbeError, sample
          for identifier, label in variants().items():
              try:
                  buf, headers = sample(media_url(identifier, "m3u8"))
                  emit(stage="variant_decode", public_id=identifier, label=label, **headers, **decode(buf))
              except Exception as err:
                  emit(stage="variant_decode", public_id=identifier,
                       error=str(err) if isinstance(err, ProbeError) else type(err).__name__)
          PYTHON
