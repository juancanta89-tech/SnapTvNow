name: Compare Apple and original live delivery on public channel 878
on:
  push:
    branches: [verify/live-release-99-878-20261119]
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare the local media decoder
        run: |
          if command -v ffmpeg && command -v ffprobe; then exit 0; fi
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\tpriority:1\n%s\tpriority:2\n' \
              'https://ftp.osuosl.org/pub/ubuntu/' 'https://mirrors.kernel.org/ubuntu/' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::https::Timeout=12 update -qq
          sudo apt-get -o Acquire::Retries=1 --no-install-recommends -y -qq install ffmpeg
      - name: Decode HLS and transport stream samples
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: python3 verification/live-formats/compare_878.py
