name: Sign production APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'audio-decoder/**'
      - 'scripts/build-native-audio.sh'

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mysteriumnetwork/openvpn_dart
          ref: e0b86e5c4f0c05a9fc3aa1ca9311275663657b68
          path: vendor/openvpn-engine
      - name: Verify OpenVPN engine
        run: echo '3540c8579b0056baac517cb6c930d9d9fb19cbbdf6216e4353fce5513aee50f6  vendor/openvpn-engine/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar' | shasum -a 256 -c -
      - uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: 8c6678b657ede1e7883fc164ef73ed483c7796c3
          path: vendor/media
          sparse-checkout: libraries/decoder_ffmpeg
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 34277e12e80031c7f89494ba543684bc1dd0be8f
          path: vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Restore verified native audio build
        id: native_audio
        uses: actions/cache@v4
        with:
          path: |
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/avconfig.h
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/ffversion.h
          key: snaptv-audio-1.11.1-6.1.4-ndk26b-v1-${{ runner.os }}
      - name: Build pinned MP2, AAC and Dolby audio decoders
        run: bash scripts/build-native-audio.sh
      - name: Cache the successfully built native audio libraries
        if: steps.native_audio.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/avconfig.h
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/ffversion.h
          key: snaptv-audio-1.11.1-6.1.4-ndk26b-v1-${{ runner.os }}
      - name: Decode private signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SNAPTVNOW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then echo 'Missing production signing key'; exit 1; fi
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/snaptvnow-production.jks"
          chmod 600 "$RUNNER_TEMP/snaptvnow-production.jks"
      - name: Build and verify signed APK
        env:
          SNAPTVNOW_KEYSTORE_FILE: ${{ runner.temp }}/snaptvnow-production.jks
          SNAPTVNOW_STORE_PASSWORD: ${{ secrets.SNAPTVNOW_STORE_PASSWORD }}
          SNAPTVNOW_KEY_ALIAS: ${{ secrets.SNAPTVNOW_KEY_ALIAS }}
          SNAPTVNOW_KEY_PASSWORD: ${{ secrets.SNAPTVNOW_KEY_PASSWORD }}
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          shasum -a 256 app/build/outputs/apk/release/app-release.apk
      - name: Upload signed APK for review
        uses: actions/upload-artifact@v4
        with:
          name: SNAPTVNOW-production-review
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove private key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/snaptvnow-production.jks"
