name: Check registered live variants
on:
  push:
    branches: [verify/live-formats-20261118]
    paths: [.github/workflows/check-live-variants.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Identify same-channel entries in Peru
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        working-directory: verification/live-formats
        run: python3 -c 'from alternatives import variants; variants()'
