name: Check registered live variants
on:
  push:
    branches: [verify/live-formats-20261118]
    paths: [.github/workflows/check-live-variants.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Look for additional Gol Peru feeds across authorized categories
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        working-directory: verification/live-formats
        run: |
          python3 - <<'PYTHON'
          import re
          from probe import api, emit, words
          try:
              rows = api("get_live_streams")
              if not isinstance(rows, list):
                  raise ValueError("missing_catalog")
              candidates = []
              for row in rows:
                  name = words(row.get("name", "")).replace("golperu", "gol peru")
                  if re.search(r"\bgol peru\b", name):
                      identifier = str(row.get("stream_id", ""))
                      if identifier.isdigit() and len(identifier) <= 14 and len(name) < 90:
                          candidates.append([identifier, name])
              emit(stage="authorized_catalog", candidates=candidates[:35], total=len(candidates))
          except Exception as error:
              emit(stage="authorized_catalog", error=type(error).__name__)
              raise SystemExit(1)
          PYTHON
