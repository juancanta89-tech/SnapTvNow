name: Measure live HLS and TS in Apple player
on:
  push:
    branches: [verify/live-transport-20261119]
    paths:
      - verification/live-formats/NativePlayback.swift
      - verification/live-formats/simulator.py
      - verification/live-formats/alternatives.py
      - .github/workflows/apple-live-compare.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and install on an iPhone simulator
        run: python3 verification/live-formats/simulator.py prepare
      - name: Open both delivery formats in the native player
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: python3 verification/live-formats/simulator.py run
