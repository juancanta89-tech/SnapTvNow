name: Confirm live Gol Peru pictures for twenty seconds
on:
  push:
    branches: [verify/live-release-99-native2-20261119]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: macos-26
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare official Apple simulator
        run: python3 verification/live-formats/simulator.py prepare
      - name: Play both released routes against the control account
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: python3 verification/live-formats/simulator.py run
