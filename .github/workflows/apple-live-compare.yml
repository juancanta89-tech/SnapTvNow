name: Play released Gol Peru for twenty seconds on iOS
on:
  push:
    branches: [verify/live-release-99-20261119]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and install on an iPhone simulator
        run: python3 verification/live-formats/simulator.py prepare
      - name: Open both delivery formats in the native player
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: python3 verification/live-formats/simulator.py run
