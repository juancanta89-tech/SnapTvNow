name: Verify continuous Apple playback of the real and synthetic channel
on:
  push:
    branches: [verify/ios-fragment-continuity-20261119]
    paths:
      - 'verification/apple-continuity/**'
      - '.github/workflows/ios-fragment-continuity.yml'
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_EDGE_REPO: ${{ github.workspace }}/verification/apple-continuity/edge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare the iPhone simulator and pinned media converter
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=""
          if ! command -v ffprobe; then
            brew install ffmpeg > "$RUNNER_TEMP/apple-ffmpeg-install.log" 2>&1 &
            installer=$!
          fi
          python3 verification/apple-continuity/run.py prepare
          if test -n "$installer"; then wait "$installer"; fi
          file="$APPLE_EDGE_REPO/cloudflare-worker/src/apple-segment-codec.wasm"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/git/blobs/dd1e7c7ff54b0dfc4342d99965dca6e91c6bc786" > "$file"
          echo "6ff9c1ac93a27c71a27199729d4dfc11c564fea1f69e5f0f15e54f358f0bd44c  $file" | shasum -a 256 -c -
      - name: Read complete current segments for the registered Gol Perú channel
        id: source
        continue-on-error: true
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: python3 verification/apple-continuity/run.py capture
      - name: Check native video across segment boundaries and decoded audio
        run: python3 verification/apple-continuity/run.py run
