name: Verify continuous Apple playback of the real and synthetic channel
on:
  push:
    branches: [verify/ios-fragment-continuity-20261119]
    paths:
      - 'verification/apple-continuity/**'
      - '.github/workflows/ios-fragment-continuity.yml'
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_EDGE_REPO: ${{ github.workspace }}/verification/apple-continuity/edge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the AVPlayer measurement app on an iPhone simulator
        run: python3 verification/apple-continuity/run.py prepare
      - name: Prepare FFmpeg and the pinned production WASM
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v ffprobe || brew install ffmpeg
          file="$APPLE_EDGE_REPO/cloudflare-worker/src/apple-segment-codec.wasm"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/git/blobs/4bfb38f616461c428de9b4d50b80466248d704df" > "$file"
          echo "1cb9ede66d9cc68fc576d900dcb69d7e917aeb0e7c211e26af6646cf5770c0b2  $file" | shasum -a 256 -c -
      - name: Read complete current segments for the registered Gol Perú channel
        id: source
        continue-on-error: true
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        run: python3 verification/apple-continuity/run.py capture
      - name: Check native video across segment boundaries and decoded audio
        run: python3 verification/apple-continuity/run.py run
