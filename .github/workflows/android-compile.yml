name: Android source check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile app sources (no APK)
        run: gradle :app:compileDebugJavaWithJavac --no-daemon
