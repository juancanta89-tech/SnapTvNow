name: Android source check
on:
  push:
    branches: [main, engineering-profile-v43]
  pull_request:

concurrency:
  group: android-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mysteriumnetwork/openvpn_dart
          ref: e0b86e5c4f0c05a9fc3aa1ca9311275663657b68
          path: vendor/openvpn-engine
      - name: Verify OpenVPN engine
        run: echo '3540c8579b0056baac517cb6c930d9d9fb19cbbdf6216e4353fce5513aee50f6  vendor/openvpn-engine/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar' | shasum -a 256 -c -
      - uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: 8c6678b657ede1e7883fc164ef73ed483c7796c3
          path: vendor/media
          sparse-checkout: libraries/decoder_ffmpeg
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: 34277e12e80031c7f89494ba543684bc1dd0be8f
          path: vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Restore verified native audio build
        id: native_audio
        uses: actions/cache@v4
        with:
          path: |
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/avconfig.h
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/ffversion.h
          key: snaptv-audio-1.11.1-6.1.4-ndk26b-v1-${{ runner.os }}
      - name: Build pinned MP2, AAC and Dolby audio decoders
        run: bash scripts/build-native-audio.sh
      - name: Cache the successfully built native audio libraries
        if: steps.native_audio.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/android-libs
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/avconfig.h
            vendor/media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/libavutil/ffversion.h
          key: snaptv-audio-1.11.1-6.1.4-ndk26b-v1-${{ runner.os }}
      - name: Test VOD playback and build test APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Compile two isolated BoxPanel packages and their update
        run: |
          python3 -m pip install Pillow==12.3.0
          node scripts/test-boxpanel-packages.mjs
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Decode real MP2, AAC, AC3 and EAC3 frames on Android 9
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-boot-timeout: 240
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            bash scripts/test-boxpanel-install.sh
            gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Upload playback test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNAPTVNOW-playback-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload VPN test APK
        uses: actions/upload-artifact@v4
        with:
          name: SNAPTVNOW-VPN-Prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
