name: Android source check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mysteriumnetwork/openvpn_dart
          ref: e0b86e5c4f0c05a9fc3aa1ca9311275663657b68
          path: vendor/openvpn-engine
      - name: Verify OpenVPN engine
        run: echo '3540c8579b0056baac517cb6c930d9d9fb19cbbdf6216e4353fce5513aee50f6  vendor/openvpn-engine/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar' | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile app sources (no APK)
        run: gradle :app:compileDebugJavaWithJavac --no-daemon
