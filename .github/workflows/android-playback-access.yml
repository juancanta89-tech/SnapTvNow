name: Verify signed SNAPTVNOW native playback
on:
  push:
    branches: [automation/repair-2026-11-10-03]

permissions:
  contents: read
  actions: read

concurrency:
  group: snaptvnow-native-acceptance
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LIVE_REQUESTED: ${{ contains(github.event.head_commit.message, '[native-playback]') }}
      NATIVE_SCOPE: ${{ contains(github.event.head_commit.message, '[series-only]') && 'series' || 'all' }}
    steps:
      - name: Require the explicitly configured test login for a live run
        if: env.LIVE_REQUESTED == 'true'
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DIEGUITO2026_PASSWORD" ]]; then
            echo '::error::Bind the protected dieguito2026 login before requesting native playback.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install the native verification toolchain
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile the external native UI probe
        run: bash verification/native-acceptance/build-probe.sh
      - name: Verify the existing signed official app
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 verification/native-acceptance/acceptance.py prepare
      - name: Prepare direct emulator audio observation
        if: env.LIVE_REQUESTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'QEMU_AUDIO_DRV=wav' >> "$GITHUB_ENV"
          echo 'QEMU_AUDIO_OUT_DRV=wav' >> "$GITHUB_ENV"
          echo 'QEMU_AUDIO_IN_DRV=none' >> "$GITHUB_ENV"
          echo "QEMU_WAV_PATH=$RUNNER_TEMP/snaptvnow-native-probe/emulator-output.wav" >> "$GITHUB_ENV"
          echo 'QEMU_WAV_FREQUENCY=44100' >> "$GITHUB_ENV"
          echo 'QEMU_WAV_FORMAT=s16' >> "$GITHUB_ENV"
          echo 'QEMU_WAV_DAC_FIXED_CHANNELS=2' >> "$GITHUB_ENV"
      - name: Enable the isolated Android runner
        if: env.LIVE_REQUESTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sign in and observe the three exact resources in the official Android app
        if: env.LIVE_REQUESTED == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          DIEGUITO2026_PASSWORD: ${{ secrets.DIEGUITO2026_PASSWORD }}
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-boot-timeout: 240
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: python3 verification/native-acceptance/acceptance.py run
      - name: Record preparation status
        if: success() && env.LIVE_REQUESTED != 'true'
        run: echo 'Native probe compiled and official APK verified. Login and playback remain pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve bounded non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SNAPTVNOW-native-acceptance-evidence
          path: |
            ${{ runner.temp }}/snaptvnow-native-probe/preparation.json
            ${{ runner.temp }}/snaptvnow-native-probe/native-report.json
          if-no-files-found: ignore
          retention-days: 7
