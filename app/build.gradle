plugins { id 'com.android.application' }
android { namespace 'com.snaptvnow.tv'; compileSdk 36
 defaultConfig { applicationId 'com.snaptvnow.tv'; minSdk 23; targetSdk 35; versionCode 31; versionName '1.0.2'; manifestPlaceholders = [appLabel: 'SNAPTVNOW'] }
 buildTypes { debug { applicationIdSuffix '.vpntrial3'; versionNameSuffix '-vpn-test-3'; manifestPlaceholders.appLabel = 'SNAPTVNOW VPN Prueba 3' } }
 packaging { jniLibs { useLegacyPackaging = true } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'network.mysterium.openvpn:icsopenvpn:0.7.55-myst'
 implementation 'androidx.media3:media3-exoplayer:1.11.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
 implementation 'androidx.media3:media3-ui:1.11.1'
}
