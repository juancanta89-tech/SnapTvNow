plugins { id 'com.android.application' }

def productionSigning = [
  file: System.getenv('SNAPTVNOW_KEYSTORE_FILE'),
  storePassword: System.getenv('SNAPTVNOW_STORE_PASSWORD'),
  alias: System.getenv('SNAPTVNOW_KEY_ALIAS'),
  keyPassword: System.getenv('SNAPTVNOW_KEY_PASSWORD')
]
def boxFile = System.getenv('BOXPANEL_BUILD_FILE')
def box = boxFile ? new groovy.json.JsonSlurper().parse(file(boxFile)) : null
if (box && (!(box.appId ==~ /[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}/) || box.packageName != 'com.snaptvnow.box.a' + box.appId.replace('-', '') || !(box.versionCode instanceof Number) || box.versionCode < 1 || box.versionCode > 2100000000 || !(box.design in ['classic','cinema','compact','aura','panorama','stadium','noir','horizon']))) throw new GradleException('Invalid BoxPanel build identity')
if (box && (!file('build/generated/boxpanel/assets/boxpanel.json').isFile() || new groovy.json.JsonSlurper().parse(file('build/generated/boxpanel/assets/boxpanel.json')) != box)) throw new GradleException('Run prepare-boxpanel.py for this exact app before building')
android { namespace 'com.snaptvnow.tv'; compileSdk 36
 defaultConfig { applicationId box ? box.packageName : 'com.snaptvnow.tv'; minSdk 23; targetSdk 35; versionCode box ? box.versionCode.intValue() : 53; versionName box ? box.versionName : '1.0.24'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; manifestPlaceholders = [appLabel: box ? box.name : 'SNAPTVNOW'] }
 signingConfigs {
  production {
   storeFile file(productionSigning.file ?: 'production-key-not-configured.jks')
   storePassword productionSigning.storePassword ?: ''
   keyAlias productionSigning.alias ?: ''
   keyPassword productionSigning.keyPassword ?: ''
  }
 }
 buildTypes { release { signingConfig signingConfigs.production }; debug { if (!box) { applicationIdSuffix '.vpntrial3'; versionNameSuffix '-vpn-test-3'; manifestPlaceholders.appLabel = 'SNAPTVNOW VPN Prueba 3' } } }
 if (box) {
  sourceSets.main.assets.srcDir file('build/generated/boxpanel/assets')
  sourceSets.release.res.srcDir file('build/generated/boxpanel/res')
  sourceSets.debug.res.srcDir file('build/generated/boxpanel/res')
 }
 packaging { jniLibs { useLegacyPackaging = true } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
 implementation project(':audio-decoder')
 implementation 'androidx.core:core:1.15.0'
 implementation 'network.mysterium.openvpn:icsopenvpn:0.7.55-myst'
 implementation 'androidx.media3:media3-exoplayer:1.11.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
 implementation 'androidx.media3:media3-ui:1.11.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'org.mockito:mockito-core:4.11.0'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
}

gradle.taskGraph.whenReady { graph ->
  if(graph.allTasks.any { it.project == project && it.name.toLowerCase(java.util.Locale.ROOT).contains('release') }) {
    if(productionSigning.values().any { !it } || !file(productionSigning.file).isFile())
      throw new GradleException('Firma de producción incompleta: configure SNAPTVNOW_KEYSTORE_FILE, SNAPTVNOW_STORE_PASSWORD, SNAPTVNOW_KEY_ALIAS y SNAPTVNOW_KEY_PASSWORD.')
  }
}
